[package]
name = "frank-opencode"
version = "0.2.1"
edition = "2021"
description = "Local Anthropic-compatible gateway exposing OpenCode models to Claude Code"
license = "MIT"

[lib]
name = "frank_opencode"
path = "src/lib.rs"

[[bin]]
name = "frank-opencode"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
dirs = "5"
rusqlite = { version = "0.31", features = ["bundled"] }
secrecy = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
async-stream = "0.3"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
sysinfo = "0.31"
anyhow = "1"
libc = "0.2"

[dev-dependencies]
axum-test = "15"
pretty_assertions = "1"
