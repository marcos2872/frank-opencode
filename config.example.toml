# ports below are examples; use --port or FRANK_PORT to change
port = 3737

# Token Claude Code sends (ANTHROPIC_AUTH_TOKEN). Empty = accept any (localhost only).
# When set, all endpoints except /health require it (x-api-key or Authorization: Bearer).
auth_token = ""

# Used when the client omits "model". Defaults to the first alias if empty.
default_model = "claude-opencode-go-kimi-k2-7-code"

# OpenCode binary used for catalog + db-path discovery.
opencode_bin = "opencode"

# Include Console free-tier (`opencode/*`, public key) models in /v1/models.
# They 403 outside OpenCode, so they are hidden by default.
include_free_tier = false

# Dodge the Claude Desktop picker's bundled third-party-model denylist
# (deepseek, kimi, gpt, ...): deepseek-v4.1-flash is advertised as
# claude-opencode-go-d-eepseek-v4-1-flash so Desktop lists it.
# Only the advertised id changes; refs and resolution are untouched.
# Leave false for Claude Code (it lists every claude-* id already).
desktop_aliases = true

# Answer Claude Code's auto-mode safety classifier (and its 1-token
# liveness probes) locally instead of forwarding upstream. Those calls
# use hardcoded first-party ids (claude-sonnet-5, claude-opus-4-8) that
# resolve to whichever catalog row carries that model id; out of quota
# they log a 429 WARN on every check. The gateway replies the "allow"
# verdict itself (<severity>0</severity> / <block>no</block> / "ok") and
# never touches the provider. Real conversations (tools + a real system
# prompt) still forward normally.
# Tradeoff: with the mock on, auto mode's LLM safety review always passes.
mock_classifier = true

# Anthropic family tiers advertised on /v1/models (anthropic_family_tier +
# is_family_default). Key = gateway id or opencode ref (provider/model),
# matched like [disabled]. Claude Desktop's background calls (session
# titles, small_fast class) pick the first discovered haiku, then sonnet,
# then opus — ignoring your chat model. Without a tier it falls back to id
# substring matching and lands on the first *sonnet* row (usually Copilot),
# burning its quota on every title (max_tokens 200, no tools). Valid tiers:
# haiku, sonnet, opus, fable, mythos. Unmapped aliases announce no tier.
[tiers."claude-opencode-go-muse-spark-1-3-contributor"]
tier = "haiku"
family_default = true

[tiers."claude-opencode-go-d-eepseek-v4-1-flash"]
tier = "sonnet"
family_default = true

[tiers."claude-opencode-go-m-imo-v2-6-flash"]
tier = "opus"
family_default = true
#
# [tiers."claude-opencode-go-muse-spark-1-3-contributor"]
# tier = "fable"
# family_default = true
#
# [tiers."claude-opencode-go-muse-spark-1-3-contributor"]
# tier = "mythos"
# family_default = true

# Upstream transport timeouts, in seconds.
# connect_timeout_secs fails fast when a provider is unreachable.
# request_timeout_secs bounds the whole request, streaming included, so it is
# generous: a long reasoning turn can legitimately stay open for many minutes.
connect_timeout_secs = 30
request_timeout_secs = 3600

# --- Blindando o Copilot contra chamadas de fundo (ver README) -------------
# O CLI do Claude Code descarta anthropic_family_tier do /v1/models e resolve
# modelos de fundo por substring do id ("claude-sonnet-*"/"claude-opus-*"),
# que batiam nas linhas do Copilot. Ids renomeados (cs = copilot-sonnet,
# co = copilot-opus) quebram o match; display_name e ref ficam os mesmos.
# Ids antigos (valem 404 no /v1/models, ref direta continua resolvendo):
#   claude-github-copilot-claude-sonnet-5       -> claude-github-copilot-cs-5
#   claude-github-copilot-claude-sonnet-5-5     -> claude-github-copilot-cs-5-5
#   claude-github-copilot-claude-opus-4-8       -> claude-github-copilot-co-4-8
#   claude-github-copilot-claude-opus-4-8-fast  -> claude-github-copilot-co-4-8-fast
#   claude-github-copilot-claude-opus-5         -> claude-github-copilot-co-5
#   claude-github-copilot-claude-opus-5-5       -> claude-github-copilot-co-5-5

[aliases."claude-github-copilot-cs-5"]
opencode = "github-copilot/claude-sonnet-5"
display_name = "Claude Sonnet 5 (github-copilot)"

[aliases."claude-github-copilot-cs-5-5"]
opencode = "github-copilot/claude-sonnet-5.5"
display_name = "Claude Sonnet 5.5 (github-copilot)"

[aliases."claude-github-copilot-co-4-8"]
opencode = "github-copilot/claude-opus-4.8"
display_name = "Claude Opus 4.8 (github-copilot)"

[aliases."claude-github-copilot-co-4-8-fast"]
opencode = "github-copilot/claude-opus-4.8-fast"
display_name = "Claude Opus 4.8 Fast (github-copilot)"

[aliases."claude-github-copilot-co-5"]
opencode = "github-copilot/claude-opus-5"
display_name = "Claude Opus 5 (github-copilot)"

[aliases."claude-github-copilot-co-5-5"]
opencode = "github-copilot/claude-opus-5.5"
display_name = "Claude Opus 5.5 (github-copilot)"


# Refs (gateway id or opencode ref) hidden from /v1/models.
[disabled]
models = [
  # "opencode-go/hy4-preview",
]
