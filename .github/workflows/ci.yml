name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref (a new push wins).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  # Job name is the required status check enforced by branch protection.
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run full test suite
        run: cargo test --locked --all-targets

  # Separate, blocking perf gate. The perf tests also run (report-only) inside
  # `test`; here the release profile enforces the p95 budget. `--test-threads=1`
  # keeps the two scenarios from contending for CPU and inflating each other's
  # tail latency. To actually block merges, add `perf` to the branch
  # protection required status checks (like `test`).
  perf:
    name: perf
    runs-on: ubuntu-latest
    needs: test
    env:
      FRANK_PERF_P95_MS: "15"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Proxy translation latency (p95 < 15ms, release)
        run: cargo test --release --locked --test perf -- --nocapture --test-threads=1
